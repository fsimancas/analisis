[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fais-platform"
version = "0.1.0"
description = "FAIS sports intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "strawberry-graphql[fastapi]>=0.257,<1",
  "uvicorn[standard]>=0.34,<1",
  "redis>=5.2,<6",
  "celery>=5.4,<6",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]
ml = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "xgboost-cpu>=3,<4",
]
deep-learning = [
  "torch>=2.7,<3",
]

[project.scripts]
fais = "fais.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fais"]

[tool.hatch.build]
include = [
  "src/fais/**/*.py",
  "src/fais/db/migrations/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
