    if(state.tab==='Cuotas y mercados')el.innerHTML=`<div class="market-block panel"><button class="market-head">Resultado final 1X2 <span>⌄</span></button><div class="market-content"><div class="odd"><span>${h.short}</span><b>1.84</b></div><div class="odd"><span>Empate</span><b>3.45</b></div><div class="odd"><span>${a.short}</span><b>4.20</b></div></div></div><div class="market-block panel"><button class="market-head">Total de goles <span>⌄</span></button><div class="market-content"><div class="odd"><span>Más de 1.5</span><b>1.31</b></div><div class="odd"><span>Más de 2.5</span><b>1.91</b></div><div class="odd"><span>Menos de 2.5</span><b>1.86</b></div><div class="odd"><span>Más de 3.5</span><b>3.10</b></div><div class="odd"><span>BTTS Sí</span><b>1.78</b></div><div class="odd"><span>BTTS No</span><b>2.02</b></div></div></div><div class="market-block panel"><button class="market-head">Córners, tarjetas y jugadores <span>⌄</span></button><div class="market-content"><div class="odd"><span>+9.5 córners</span><b>1.95</b></div><div class="odd"><span>+4.5 tarjetas</span><b>1.72</b></div><div class="odd"><span>Gol Cardona</span><b>4.50</b></div><div class="odd"><span>Local 1ª tarjeta</span><b>2.20</b></div><div class="odd"><span>+2.5 tiros jugador</span><b>1.80</b></div><div class="odd"><span>Penalti en partido</span><b>3.75</b></div></div></div>`;
    document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>go('person','player'));if($('addLineup'))$('addLineup').onclick=()=>openModal();if($('analyze'))$('analyze').onclick=runAnalysis;if($('resimulate'))$('resimulate').onclick=()=>{showToast('Simulación recalculada con 50.000 escenarios');$('resimulate').textContent='✓ Simulación actualizada'};document.querySelectorAll('.market-head').forEach(b=>b.onclick=()=>{const c=b.nextElementSibling;c.style.display=c.style.display==='none'?'grid':'none'})}
  function runAnalysis(){const b=$('analyze');b.classList.add('loading');b.textContent='Analizando datos, forma, árbitro y mercados…';setTimeout(()=>{b.classList.remove('loading');b.textContent='✓ Análisis calculado';$('analysisResult').innerHTML='<div class="analysis-card" style="margin-top:12px;border-color:#2dd4a84d"><span>Mercados con mayor tendencia</span><strong style="color:#5eead4">Local +0.5 · Más de 1.5 goles · Más de 4.5 tarjetas</strong></div>';showToast('Análisis del partido completado')},900)}
  function personView(){const referee=state.person==='referee';setCrumb(referee?'Árbitros / Wilmar Roldán':'Jugadores / Edwin Cardona');const info=referee?{name:'Wilmar Roldán',emoji:'🟨',team:'Federación Colombiana',position:'Árbitro FIFA',age:46,nationality:'Colombia',number:'FIFA',stats:{Partidos:19,'Amarillas / partido':5.31,'Rojas / partido':0.24,'Penaltis / partido':0.32,Faltas:24.8,'Local gana':'46%','Visitante gana':'27%','VAR interviene':'18%','Nota media':7.18}}:playerData;$('app').innerHTML=`<div class="view-head"><div><div class="kicker">${referee?'Perfil arbitral':'Perfil individual'}</div><h1>${info.name}</h1><p>Temporada 2026 · Datos y rendimiento calculado</p></div><button class="btn">☆ Seguir perfil</button></div><div class="person"><section class="panel person-card"><div class="portrait">${info.emoji}</div><div><h2>${info.name}</h2><p>${info.position}</p><div class="profile-row"><span>Organización</span><b>${info.team}</b></div><div class="profile-row"><span>Nacionalidad</span><b>${info.nationality}</b></div><div class="profile-row"><span>Edad</span><b>${info.age}</b></div><div class="profile-row"><span>${referee?'Categoría':'Dorsal'}</span><b>${info.number}</b></div></div></section><section class="panel bio"><h2>Estadísticas de la temporada</h2><div class="player-stats">${Object.entries(info.stats).map(([k,v])=>`<div class="player-stat"><span>${k}</span><b>${v}</b></div>`).join('')}</div><h2 style="margin-top:20px">Tendencia y análisis</h2><p style="color:var(--muted);font-size:10px;line-height:1.7">${referee?'Promedio alto de tarjetas y mayor frecuencia de sanciones durante el segundo tiempo. Su presencia eleva un 9% la tendencia del mercado de más de 4.5 tarjetas.':'Alta influencia entre líneas, producción consistente de pases clave y balón parado. Participa directamente en el 31% de los goles de su equipo cuando es titular.'}</p><div class="bars">${[55,68,61,80,72,88,77,84].map((v,i)=>`<div style="height:${v}%"><span>J${i+11}</span></div>`).join('')}</div></section></div>`}
  function render(){nav();if(state.view==='scores')scoresView();if(state.view==='league')leagueView();if(state.view==='team')teamView();if(state.view==='match')matchView();if(state.view==='person')personView()}
  function openModal(){$('modal').classList.add('open');$('lineupText').focus()} function closeModal(){$('modal').classList.remove('open')}
  document.querySelector('[data-view]').onclick=()=>go('scores');$('menuBtn').onclick=()=>$('sidebar').classList.add('open');$('bell').onclick=()=>showToast('3 alertas de mercado pendientes');$('globalSearch').onclick=()=>showToast('Usa el buscador lateral para encontrar competiciones');$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('saveLineup').onclick=()=>{closeModal();showToast('Alineación final agregada a la demostración')};$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('sideSearch').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.league-btn').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'block':'none')};render();
  </script>
